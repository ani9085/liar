<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>자동 보호 설정</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E40AF}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 412px; height: 1140px; box-sizing: border-box; padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 18px; background: #F3F5F9; color: #111827; font-family: 'Noto Sans KR', system-ui, sans-serif">

  <a href="Main.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 0 8px; color: #1E40AF; text-decoration: none; font-size: 22px; font-weight: 700">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
    처음으로
  </a>

  <h1 style="margin: 0; font-size: 32px; font-weight: 900; line-height: 1.3; letter-spacing: -0.5px">자동 보호 설정</h1>

  <section style="border-radius: 24px; background: #FFFFFF; border: 2px solid #E5E7EB; display: flex; flex-direction: column">
    <button type="button" aria-pressed="true" style="display: flex; align-items: center; gap: 14px; min-height: 96px; padding: 16px 20px; border: none; border-bottom: 2px solid #EEF0F3; background: transparent; color: #111827; font-family: inherit; text-align: left; border-radius: 24px 24px 0 0">
      <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
        <strong style="font-size: 24px; font-weight: 900">문자 자동 확인</strong>
        <span style="font-size: 19px; color: #4B5563; line-height: 1.4">문자가 오면 바로 검사해요</span>
      </span>
      <span style="width: 64px; height: 38px; border-radius: 999px; background: #1E40AF; display: flex; align-items: center; justify-content: flex-end; padding: 4px; box-sizing: border-box; flex-shrink: 0">
        <span style="width: 30px; height: 30px; border-radius: 50%; background: #FFFFFF"></span>
      </span>
    </button>
    <button type="button" aria-pressed="true" style="display: flex; align-items: center; gap: 14px; min-height: 96px; padding: 16px 20px; border: none; border-bottom: 2px solid #EEF0F3; background: transparent; color: #111827; font-family: inherit; text-align: left">
      <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
        <strong style="font-size: 24px; font-weight: 900">카카오톡 알림 확인</strong>
        <span style="font-size: 19px; color: #4B5563; line-height: 1.4">카톡 알림에 보이는 글을 검사해요</span>
      </span>
      <span style="width: 64px; height: 38px; border-radius: 999px; background: #1E40AF; display: flex; align-items: center; justify-content: flex-end; padding: 4px; box-sizing: border-box; flex-shrink: 0">
        <span style="width: 30px; height: 30px; border-radius: 50%; background: #FFFFFF"></span>
      </span>
    </button>
    <button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 14px; min-height: 96px; padding: 16px 20px; border: none; background: transparent; color: #111827; font-family: inherit; text-align: left; border-radius: 0 0 24px 24px">
      <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
        <strong style="font-size: 24px; font-weight: 900">모르는 전화 경고</strong>
        <span style="font-size: 19px; color: #4B5563; line-height: 1.4">저장 안 된 번호면 미리 알려요</span>
      </span>
      <span style="width: 64px; height: 38px; border-radius: 999px; background: #9CA3AF; display: flex; align-items: center; justify-content: flex-start; padding: 4px; box-sizing: border-box; flex-shrink: 0">
        <span style="width: 30px; height: 30px; border-radius: 50%; background: #FFFFFF"></span>
      </span>
    </button>
  </section>

  <section style="padding: 20px; border-radius: 24px; background: #FFFFFF; border: 2px solid #E5E7EB; display: flex; flex-direction: column; gap: 14px">
    <h2 style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 900">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1E40AF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.8.3 5 2.5 5 5.8"/></svg>
      보호자 연결
    </h2>
    <p style="margin: 0; font-size: 20px; color: #4B5563; line-height: 1.5">위험한 문자가 오면 이분께 알려드려요.</p>
    <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: #F3F5F9">
      <span style="width: 52px; height: 52px; border-radius: 50%; background: #E8EEFC; color: #1E40AF; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; flex-shrink: 0">자</span>
      <span style="display: flex; flex-direction: column">
        <strong style="font-size: 22px; font-weight: 700">[자녀 이름]</strong>
        <span style="font-size: 19px; color: #4B5563">[전화번호]</span>
      </span>
    </div>
    <button type="button" style="min-height: 64px; border-radius: 18px; border: 2px solid #D1D5DB; background: #FFFFFF; color: #111827; font-family: inherit; font-size: 22px; font-weight: 700">보호자 바꾸기</button>
  </section>

  <section style="padding: 20px; border-radius: 24px; background: #FFFFFF; border: 2px solid #E5E7EB; display: flex; flex-direction: column; gap: 14px">
    <h2 style="margin: 0; font-size: 24px; font-weight: 900">글씨 크기</h2>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" aria-pressed="false" style="min-height: 72px; border-radius: 18px; border: 2px solid #D1D5DB; background: #FFFFFF; color: #111827; font-family: inherit; font-size: 22px; font-weight: 700">크게</button>
      <button type="button" aria-pressed="true" style="min-height: 72px; border-radius: 18px; border: 3px solid #1E40AF; background: #E8EEFC; color: #1E3A8A; font-family: inherit; font-size: 27px; font-weight: 900">아주 크게</button>
    </div>
  </section>

  <p style="margin: 0; font-size: 18px; color: #4B5563; line-height: 1.55">문자와 알림 내용은 이 휴대폰 안에서 먼저 검사해요. 더 정확한 확인이 필요할 때만 개인정보를 가린 뒤 서버로 보내요.</p>
</div>
</x-dc>
